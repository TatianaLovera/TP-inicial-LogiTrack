name: CI LogiTrack (Flask)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # ¡LA SOLUCIÓN ESTÁ ACÁ! Le decimos al robot que entre a tu carpeta
    defaults:
      run:
        working-directory: ./logitrack

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Ejecutar Linter (Flake8)
      run: |
        flake8 app.py test_app.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar Tests Mínimos (Pytest)
      run: |
        pytest test_app.py
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar Tests Mínimos (Pytest)
      run: |
        pytest test_app.py
