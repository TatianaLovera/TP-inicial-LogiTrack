name: CI LogiTrack (Flask)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# ¡ACÁ ESTÁ LA MAGIA PARA SACAR EL WARNING!
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./logitrack

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    - name: Ejecutar Linter (Flake8)
      run: |
        flake8 app.py tests/test_app.py --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Ejecutar Tests Mínimos (Pytest)
      run: |
        pytest tests/