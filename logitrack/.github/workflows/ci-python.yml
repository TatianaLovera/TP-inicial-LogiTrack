name: CI LogiTrack (Flask)

# El robot se despierta cada vez que alguien sube código a main o master
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. El robot descarga todo tu repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Prepara una computadora virtual con Python
    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Instala Flask y las herramientas de revisión
    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest

    # 4. PASO LINTER: Revisa que el código sea prolijo y no tenga errores graves
    - name: Ejecutar Linter (Flake8)
      run: |
        flake8 app.py test_app.py --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. PASO TESTS: Ejecuta tu test mínimo para ver si la app arranca
    - name: Ejecutar Tests Mínimos (Pytest)
      run: |
        pytest test_app.py
