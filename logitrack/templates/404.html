<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Página no encontrada | LogiTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="error-page">
    <div class="error-wrapper">
        <div class="error-card">
            <div class="error-icon">404</div>
            <h1 class="page-title">Página no encontrada</h1>
            <p class="page-subtitle">Lo sentimos, el recurso que estás buscando no existe o fue movido de sección.</p>
            
            <div class="error-actions">
                <a href="{{ url_for('listar_envios') }}" class="btn btn-primary">
                    <span>🏠</span> Volver al inicio
                </a>
            </div>
            
            <div class="error-footer">
                <code class="tracking-code">ERROR_CODE: ROUTE_NOT_FOUND</code>
            </div>
        </div>
    </div>
</body>
</html>
